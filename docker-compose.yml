services:
  postgres:
    image: postgres:16-alpine
    container_name: metroCheck_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mkair}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mkair_secret}
      POSTGRES_DB: ${POSTGRES_DB:-mkair}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "172.17.0.1:${POSTGRES_PORT:-5434}:5432"
    networks:
      - backend_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mkair} -d ${POSTGRES_DB:-mkair}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: metroCheck_redis
    restart: always
    volumes:
      - redis_data:/data
    ports:
      - "172.17.0.1:${REDIS_PORT:-6382}:6379"
    networks:
      - backend_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: ghcr.io/mflkee/metrocheck-backend:${IMAGE_TAG:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: metroCheck_backend
    restart: always
    # Конфигурация приложения берётся из env-файла: compose подхватывает его сам,
    # поэтому `docker compose up -d` без `--env-file` больше не запускает
    # приложение на дефолтах (и не отключает, например, отправку писем молча).
    env_file:
      - .env.production
    environment:
      # Только то, что вычисляется в compose или не хранится в env-файле.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-mkair}:${POSTGRES_PASSWORD:-mkair_secret}@postgres:5432/${POSTGRES_DB:-mkair}
      REDIS_URL: redis://redis:6379/0
      ARSHIN_BEARER_TOKEN: ${ARSHIN_BEARER_TOKEN:-}
      METROCHECK_DISABLE_AI: "true"
      FRONTEND_APP_URL: ${FRONTEND_APP_URL:-https://metrocheck.mkair-it.ru}
    ports:
      - "${BACKEND_PORT:-8002}:8000"
    volumes:
      - ./backend:/app
      - /home/mflkee/SynologyDrive/tokens:/shared/tokens
      - ${PROTOCOLS_HOST_PATH:-/home/mflkee/protocols}:${METROCHECK_PROTOCOLS_PATH:-/protocols}:ro
      - /home/mflkee/reports:/reports
    networks:
      - backend_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 40s
    stop_grace_period: 30s

  frontend:
    image: ghcr.io/mflkee/metrocheck-frontend:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: metroCheck_frontend
    restart: always
    ports:
      - "${FRONTEND_PORT:-8081}:80"
    networks:
      - backend_network
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:

networks:
  backend_network:
    driver: bridge
