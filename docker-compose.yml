services:
  postgres:
    image: postgres:16-alpine
    container_name: metroCheck_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mkair}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mkair_secret}
      POSTGRES_DB: ${POSTGRES_DB:-mkair}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    networks:
      - backend_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mkair} -d ${POSTGRES_DB:-mkair}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: metroCheck_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6382}:6379"
    networks:
      - backend_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: metroCheck_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-mkair}:${POSTGRES_PASSWORD:-mkair_secret}@postgres:5432/${POSTGRES_DB:-mkair}
      REDIS_URL: redis://redis:6379/0
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      ARSHIN_BEARER_TOKEN: ${ARSHIN_BEARER_TOKEN}
      FASTAPI_API_KEY: ${FASTAPI_API_KEY:-mkair-secret-key}
      APP_ENV: ${APP_ENV:-development}
      TOKEN_FILE_PATH: ${TOKEN_FILE_PATH:-/shared/tokens/arshin-token.json}
    ports:
      - "${BACKEND_PORT:-8002}:8000"
    volumes:
      - ./backend:/app
      - /home/mflkee/SynologyDrive/tokens:/shared/tokens:ro
    networks:
      - backend_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  frontend:
    image: nginx:alpine
    container_name: metroCheck_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8081}:80"
    volumes:
      - ./backend/app/static:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - backend_network
    depends_on:
      - backend

  n8n:
    image: n8nio/n8n:latest
    container_name: metroCheck_n8n
    restart: unless-stopped
    environment:
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_USER:-admin}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_PASSWORD:-admin}
      N8N_SECURE_COOKIE: "false"
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_HOST: localhost
      WEBHOOK_URL: http://localhost:${N8N_PORT:-5681}/
      GENERIC_TIMEZONE: ${TZ:-Europe/Moscow}
      N8N_MCP_SERVER_ENABLED: "true"
      N8N_MCP_SERVER_API_KEY: ${N8N_MCP_KEY:-mkair-mcp-key}
      N8N_API_KEY: ${N8N_API_KEY:-mkair-n8n-api-key}
      EXECUTIONS_MODE: queue
      QUEUE_BULL_REDIS_HOST: redis
      QUEUE_BULL_REDIS_PORT: 6379
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-mkair}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-mkair}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:-mkair_secret}
      MKAIR_PROTOCOLS_PATH: ${MKAIR_PROTOCOLS_PATH:-/protocols}
    ports:
      - "${N8N_PORT:-5681}:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - ${PROTOCOLS_HOST_PATH:-./protocols}:${MKAIR_PROTOCOLS_PATH:-/protocols}:ro
    networks:
      - backend_network
      - mkair_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  n8n_data:

networks:
  backend_network:
    driver: bridge
  mkair_network:
    driver: bridge
