services:
  postgres:
    image: postgres:16-alpine
    container_name: metroCheck_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mkair}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mkair_secret}
      POSTGRES_DB: ${POSTGRES_DB:-mkair}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    networks:
      - backend_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mkair} -d ${POSTGRES_DB:-mkair}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: metroCheck_redis
    restart: always
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6382}:6379"
    networks:
      - backend_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: metroCheck_backend
    restart: always
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-mkair}:${POSTGRES_PASSWORD:-mkair_secret}@postgres:5432/${POSTGRES_DB:-mkair}
      REDIS_URL: redis://redis:6379/0
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      ARSHIN_BEARER_TOKEN: ${ARSHIN_BEARER_TOKEN}
      FASTAPI_API_KEY: ${FASTAPI_API_KEY:-metrocheck-secret-key}
      APP_ENV: ${APP_ENV:-development}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin-metrochek}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      TOKEN_FILE_PATH: ${TOKEN_FILE_PATH:-/shared/tokens/arshin-token.json}
      METROCHECK_PROTOCOLS_PATH: ${METROCHECK_PROTOCOLS_PATH:-/protocols}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      FROM_EMAIL: ${FROM_EMAIL:-metrocheck-reports@example.com}
      REPORT_EMAIL: ${REPORT_EMAIL:-}
    ports:
      - "${BACKEND_PORT:-8002}:8000"
    volumes:
      - ./backend:/app
      - /home/mflkee/SynologyDrive/tokens:/shared/tokens
      - ${PROTOCOLS_HOST_PATH:-./protocols}:${METROCHECK_PROTOCOLS_PATH:-/protocols}:ro
      - /home/mflkee/reports:/reports
    networks:
      - backend_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 40s
    stop_grace_period: 30s

  frontend:
    image: nginx:alpine
    container_name: metroCheck_frontend
    restart: always
    ports:
      - "${FRONTEND_PORT:-8081}:80"
    volumes:
      - ./backend/app/static:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - backend_network
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:

networks:
  backend_network:
    driver: bridge
