<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ARSHIN Token Relay</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>ARSHIN Token Relay</h1>
        <p class="subtitle">Проброс токена в локальный агент</p>
      </div>

      <div class="status" id="status">
        <span class="dot" id="status-dot"></span>
        <span id="status-text">Проверка...</span>
      </div>

      <div class="section">
        <label for="token-input">Вставь токен (JWT) вручную:</label>
        <textarea
          id="token-input"
          placeholder="eyJhbGciOiJ..."
          rows="4"
        ></textarea>
        <button id="send-btn" class="btn-primary">Отправить в агент</button>
        <div class="hint">
          Для теста можно сгенерировать тестовый токен через меню ниже.
        </div>
      </div>

      <div class="section">
        <button id="test-btn" class="btn-secondary">Сгенерировать и отправить тестовый токен</button>
      </div>

      <div class="section">
        <button id="scan-btn" class="btn-secondary">
          Сканировать localStorage этой страницы
        </button>
      </div>

      <div id="result" class="result"></div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
