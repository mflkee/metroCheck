services:
  awg:
    image: alpine:3.20
    container_name: mkair_warp_test
    command: >
      sh -c "
        apk add --no-cache bash curl tinyproxy iptables-legacy openresolv iproute2 >/dev/null 2>&1 &&
        update-alternatives --install /sbin/iptables iptables /sbin/iptables-legacy 10 >/dev/null 2>&1 &&
        tinyproxy -d &
        sleep 1 &&
        wg-quick up /config/awg.conf 2>&1 &&
        echo '=== TEST ===' &&
        curl -sI --max-time 15 https://openrouter.ai/api/v1/models | head -5 &&
        echo '=== PROXY READY ===' &&
        sleep infinity
      "
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    volumes:
      - ./awg.conf:/config/awg.conf:ro
      - /usr/bin/awg:/usr/bin/awg:ro
      - /usr/bin/awg-quick:/usr/bin/wg-quick:ro
      - /usr/bin/amneziawg-go:/usr/bin/amneziawg-go:ro
    ports:
      - "8888:8888"
    restart: unless-stopped
