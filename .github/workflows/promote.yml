name: Promote metroCheck (staging -> prod)
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Образ для прода (staging = текущий стейдж, sha-<hash> = откат)'
        required: false
        default: 'staging'

permissions:
  contents: read
  packages: write

jobs:
  promote:
    runs-on: [self-hosted, mkair]
    environment: production
    steps:
      - name: Pull repo code
        run: |
          mkdir -p ~/apps ~/.backups
          cd ~/apps/metroCheck || git clone git@github.com:mflkee/metroCheck.git ~/apps/metroCheck
          cd ~/apps/metroCheck
          if [ -f .env.production ]; then cp .env.production ~/.backups/metrocheck_env_prod_$(date +%Y%m%d_%H%M%S).bak; fi
          git fetch origin && git reset --hard origin/main
          [ -f .env.production ] || cp .env.production.example .env.production 2>/dev/null || true
      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Backup DB
        run: |
          mkdir -p ~/.backups
          cd ~/apps/metroCheck
          docker compose exec -T postgres pg_dump -U mkair mkair > ~/.backups/metroCheck_db_promote_$(date +%Y%m%d_%H%M%S).sql
      - name: Promote (same image, tag=${{ inputs.tag }})
        run: |
          cd ~/apps/metroCheck
          IMAGE_TAG=${{ inputs.tag }} docker compose -p metrocheck --env-file .env.production pull
          IMAGE_TAG=${{ inputs.tag }} docker compose -p metrocheck --env-file .env.production up -d
          IMAGE_TAG=${{ inputs.tag }} docker compose -p metrocheck --env-file .env.production exec -T backend alembic upgrade head
      - name: Prod health
        run: |
          for _ in {1..60}; do
            curl -fsS http://127.0.0.1:8002/health >/dev/null 2>&1 && { echo PROD_OK; exit 0; }
            sleep 2
          done
          echo PROD_FAIL; exit 1