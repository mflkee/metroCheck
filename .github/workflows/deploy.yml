name: Deploy metroCheck to Production

on:
  push:
    branches: [release/*]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, mkair]
    environment: production
    steps:
      - name: Ensure repo exists or clone
        run: |
          if [ ! -d ~/apps/metroCheck/.git ]; then
            mkdir -p ~/apps
            git clone git@github.com:mflkee/metroCheck.git ~/apps/metroCheck
          fi

      - name: Pull latest code
        run: |
          cd ~/apps/metroCheck
          # Сохраняем .env.production перед git reset --hard
          if [ -f .env.production ]; then
            cp .env.production /tmp/metrocheck_env_production_backup
            echo 'Backed up .env.production'
          fi
          git fetch origin
          git reset --hard origin/${{ github.ref_name }}
          # Восстанавливаем .env.production
          if [ -f /tmp/metrocheck_env_production_backup ]; then
            cp /tmp/metrocheck_env_production_backup .env.production
            echo 'Restored .env.production from backup'
          else
            echo 'WARNING: no .env.production found'
          fi
          # Защита от accidental commit
          if ! grep -q '^\.env\.production$' .gitignore 2>/dev/null; then
            echo '.env.production' >> .gitignore
          fi
          

      - name: Backup production database
        run: |
          cd ~/apps/metroCheck
          docker compose exec -T postgres pg_dump -U mkair mkair > /tmp/metroCheck_backup_$(date +%Y%m%d_%H%M%S).sql

      - name: Build & deploy production
        run: |
          cd ~/apps/metroCheck
          docker compose down
          docker compose up -d --build

      - name: Apply database migrations
        run: |
          cd ~/apps/metroCheck
          docker compose exec -T backend alembic upgrade head

      - name: Health check
        run: |
          for _ in {1..30}; do
            if curl -fsS http://127.0.0.1:8002/health >/dev/null 2>&1; then
              echo 'Backend is ready'
              exit 0
            fi
            sleep 1
          done
          echo 'Backend failed to become ready within 30s'
          exit 1

      - name: Show status
        if: always()
        run: |
          cd ~/apps/metroCheck
          docker compose ps
