name: One-off: удалить устаревшие release/* ветки

# Временный воркфлоу. Штатный release-branch-cleanup.yml требует workflow_dispatch,
# а у токена агента нет прав Actions: write. Поэтому здесь то же удаление через
# GITHUB_TOKEN, но по push в main. После отработки файл удаляется.
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: [self-hosted, mkair]
    steps:
      - name: Delete stale release branches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          for b in release/0.2.0; do
            code=$(curl -s -o /tmp/out -w '%{http_code}' -X DELETE \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/git/refs/heads/$b")
            echo "$b -> HTTP $code"
          done
