name: Deploy to Staging

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-staging:
    runs-on: [self-hosted, mkair]
    environment: staging
    steps:
      - name: Checkout staging code
        run: |
          cd ~/apps/metroCheck
          git fetch origin
          git reset --hard origin/main

      - name: Build & deploy staging
        run: |
          cd ~/apps/metroCheck
          # Remove stale containers by name to avoid name conflict
          docker rm -f metroCheck_postgres_stg metroCheck_redis_stg metroCheck_backend_stg metroCheck_frontend_stg 2>/dev/null || true
          docker compose -p metrocheck-stg -f docker-compose.staging.yml --env-file .env.staging up -d --build

      - name: Apply staging migrations
        run: |
          cd ~/apps/metroCheck
          # Wait for postgres container to accept connections
          for _ in {1..30}; do
            docker exec metroCheck_postgres_stg pg_isready -U mkair -d mkair_stg 2>/dev/null && break
            sleep 1
          done
          docker compose -p metrocheck-stg -f docker-compose.staging.yml --env-file .env.staging run --no-deps --rm backend alembic upgrade head

      - name: Staging health check
        run: |
          for _ in {1..30}; do
            if curl -fsS http://127.0.0.1:9002/health >/dev/null 2>&1; then
              echo "Staging backend is ready"
              exit 0
            fi
            sleep 1
          done
          echo "Staging backend failed to become ready within 30s"
          exit 1

      - name: Show staging status
        if: always()
        run: |
          cd ~/apps/metroCheck
          docker compose -p metrocheck-stg -f docker-compose.staging.yml --env-file .env.staging ps
